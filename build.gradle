plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    version = project.mod_version
    group = project.maven_group

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(project.java_version)
        targetCompatibility = JavaVersion.toVersion(project.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = project.java_version as Integer
    }

    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') {
            expand version: project.version
        }
    }

    tasks.register('run') {
        group = '.run'
        dependsOn ':arcane-artistry-shell:runClient'
    }
}
