// This project has no Java source of its own. Its only job
// is to bundle the "real" modules into one distributable
// jar via Loom's jar-in-jar `include` mechanism.
dependencies {
    implementation project(':arcane-artistry-core')
    include project(':arcane-artistry-core')

    implementation project(':arcane-artistry-base')
    include project(':arcane-artistry-base')
}
