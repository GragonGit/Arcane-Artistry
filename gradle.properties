# ---------------------------------------------------------------------------
# Minecraft & toolchain
#
# Verified 2026-09 against Mojang/Fabric's own current documentation (see
# README.md "Before you build" for sources/dates). Minecraft dropped the
# 1.x scheme in 2026; 26.2 ("Chaos Cubed", released 2026-06-16) is the
# version this design document targets and is the current stable release
# as of this writing.
#
# IMPORTANT: 26.2 ships UNOBFUSCATED. That's why there is no yarn_mappings
# entry here, and why the build.gradle files use plain implementation/api
# instead of modImplementation/modApi -- see root build.gradle for details.
# If you ever retarget this project at an older, obfuscated Minecraft
# version, you will need to add mappings back in.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.160.0+26.2
loom_version=1.17.17

# Minecraft 26.x requires Java 25 (up from Java 21 on the old 1.21.x line).
java_version=25

# ---------------------------------------------------------------------------
# Mod metadata
mod_version=0.1.0
maven_group=net.arcaneartistry
